<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
        />

        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        />

        <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        rel="stylesheet"
        />
        
<link href="../CSS/toggleSide.css " rel="stylesheet">
        <link rel="stylesheet" href="../CSS/Variables.css" />
        <link rel="stylesheet" href="../CSS/Messages.css" />
        <link rel="stylesheet" href="../CSS/connect.css" />
        <title>Messages</title>
    </head>
    <body>
        
         <button class="menu-toggle d-lg-none">
    <i class="bi bi-list"></i>
</button>
        <!----------------------------------- Side Menu ------------------------------------>
        
        <div class="container-fluid">
            <div class="row align-items-start px-3 py-3">
                <div class="col-sm-12 col-lg-2 ">
                    <aside class="sidebar">
                        <div class="logo">
                            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
          <span class="logo-icon">S</span>
          <span class="logo-text">Swaply</span>
        </a>
                        </div>

                        <nav class="sidebar-menu">
                            <a href="../index.html" class="sidebar-item">
                  <i class="bi bi-grid"></i>
                  <span>Home</span>
                </a>

                            <a href="profile.html" class="sidebar-item">
                            <i class="bi bi-person"></i>
                            <span>Profile</span>
                            </a>

                            <a href="search skills.html" class="sidebar-item">
                            <i class="bi bi-search"></i>
                            <span>Search Skills</span>
                            </a>

                            <a href="./request.html" class="sidebar-item">
                            <i class="bi bi-person-plus"></i>
                            <span>Requests</span>
                            <span class="menu-badge">2</span>
                            </a>

                            <a href="connect.html" class="sidebar-item ">
                            <i class="bi bi-people"></i>
                            <span>Connections</span>
                            </a>

                            <a href="Messages.html" class="sidebar-item active">
                            <i class="bi bi-chat"></i>
                            <span>Messages</span>
                            <span class="menu-badge">3</span>
                            </a>
                        </nav>

                        <div class="sidebar-bottom">
                            <a href="./Settings.html" class="sidebar-item">
                            <i class="bi bi-gear"></i>
                            <span>Settings</span>
                            </a>

                            <a href="#" class="sidebar-item">
                            <i class="bi bi-box-arrow-right"></i>
                            <span>Logout</span>
                            </a>
                        </div>
                    </aside>
                </div>

                
               
                <!----------------------------------- The Main Content ------------------------------------>
               
                <div class="Main-Content col-sm-12 col-lg-10">

                    <!-- Message Menu -->
                    <div class="Mes-Menu">
                        <button class="active-button" data-filter="all">All</button>
                        <button data-filter="unread">Unread</button>
                        <button data-filter="archived">Archived</button>
                    </div>

                    <!-- Sent Messages -->
                    <div class="Sent-Messages ">
                        <div class="Header">

                            <div class="icon">
                                <i class="fa-solid fa-paper-plane fa-2xl"></i>
                            </div>
                            <div class="text">
                                <h3>Sent Messages</h3>
                                <p>View all the messages you have sent to your connections.</p>
                            </div>
                        </div>
                        <div id="message-list"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Chat Modal -->
        <div class="modal fade" id="chatModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content chat-modal-content">

                    <div class="modal-header chat-modal-header">
                    <div class="chat-person-info">
                        <img id="chatAvatar" class="chat-avatar" src="" alt="">
                        <div>
                            <h5 id="chatName" class="mb-0"></h5>
                            <small id="chatUsername" class="text-muted"></small>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <button id="archiveChatBtn" class="btn-archive" title="Archive chat">
                            <i class="fa-solid fa-box-archive"></i>
                        </button>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                </div>

                    <div class="modal-body chat-modal-body" id="chatMessages"></div>

                    <div class="modal-footer chat-modal-footer">
                        <input type="text" id="chatInput" class="form-control" placeholder="Type a message...">
                        <button id="sendChatBtn" class="btn btn-primary">Send</button>
                    </div>

                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../JS/theme.js" defer></script>
        <script src="../JS/toggle.js" defer></script>
        <script src="../JS/messages.js" defer></script>
    </body>
</html>
