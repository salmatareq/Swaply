<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Swap Offers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <link rel="stylesheet" href="../CSS/Variables.css">
    
    <link rel="stylesheet" href="../CSS/offer.css">
</head>
<body>

    <div class="custom-offer-section p-4 rounded-4 my-4 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h3 class="section-title mb-1">My Swap Offers</h3>
          <p class="section-subtitle mb-0">Create temporary offers for your available skills</p>
        </div>
        <button type="button" class="btn-custom-add" id="openOfferModalBtn">
          <i class="fa-solid fa-plus-circle me-1"></i> Add Offer
        </button>
      </div>

      <div class="offers-display-box p-3 rounded-3" id="dynamicOffersContainer">
        <div class="empty-state-text">No active offers added. Click "Add Offer" to start.</div>
      </div>
    </div>

    <div class="custom-modal-overlay" id="customOfferModal" style="display: none;">
      <div class="custom-modal-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0">Create Swap Offer</h4>
          <button type="button" class="custom-close-btn" id="closeModalBtn">&times;</button>
        </div>
        
        <form id="uniqueOfferForm">
          <div class="mb-3 text-start">
            <label for="skillSelection" class="form-label-custom">Select Course / Skill</label>
            <select class="form-control-custom" id="skillSelection" required>
              <option value="" disabled selected>Choose a course...</option>
            </select>
          </div>

          <div class="mb-4 text-start">
            <label class="form-label-custom">Available Days</label>
            <div id="daySelection" class="d-flex flex-column gap-2 p-2 form-control-custom" style="height: auto; max-height: 150px; overflow-y: auto;">
              <div class="form-check">
                <input class="form-check-input day-checkbox" type="checkbox" value="Monday" id="dayMonday">
                <label class="form-check-label" for="dayMonday">Monday</label>
              </div>
              <div class="form-check">
                <input class="form-check-input day-checkbox" type="checkbox" value="Tuesday" id="dayTuesday">
                <label class="form-check-label" for="dayTuesday">Tuesday</label>
              </div>
              <div class="form-check">
                <input class="form-check-input day-checkbox" type="checkbox" value="Wednesday" id="dayWednesday">
                <label class="form-check-label" for="dayWednesday">Wednesday</label>
              </div>
              <div class="form-check">
                <input class="form-check-input day-checkbox" type="checkbox" value="Thursday" id="dayThursday">
                <label class="form-check-label" for="dayThursday">Thursday</label>
              </div>
              <div class="form-check">
                <input class="form-check-input day-checkbox" type="checkbox" value="Friday" id="dayFriday">
                <label class="form-check-label" for="dayFriday">Friday</label>
              </div>
              <div class="form-check">
                <input class="form-check-input day-checkbox" type="checkbox" value="Saturday" id="daySaturday">
                <label class="form-check-label" for="daySaturday">Saturday</label>
              </div>
              <div class="form-check">
                <input class="form-check-input day-checkbox" type="checkbox" value="Sunday" id="daySunday">
                <label class="form-check-label" for="daySunday">Sunday</label>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn-custom-secondary" id="cancelModalBtn">Cancel</button>
            <button type="submit" class="btn-custom-primary">Publish Offer</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../JS/offer.js" defer></script>
    <script src="../JS/theme.js"></script>
</body>
</html>
